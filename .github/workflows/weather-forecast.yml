name: Rain and temperature
on:
  # EventBridge rule monthly-updates-weather-forecast fires this at 02:41,
  # 10:41, 14:41, and 22:41 UTC. 02:41 is after the 18 UTC AIFS run, 10:41
  # after the 00 UTC IFS 0.1° run, 14:41 after the 06 UTC AIFS run, and 22:41
  # after the 12 UTC IFS 0.1° run.
  workflow_dispatch:
    inputs:
      upload_to_s3:
        description: "Upload the rainfall and temperature pages"
        required: false
        default: true
        type: boolean
      scheduled:
        description: "Count this run as the scheduled event"
        required: false
        default: false
        type: boolean
concurrency:
  group: monthly-weather-forecast
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      WORK_ROOT: /tmp/monthly-updates/weather-forecast
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_PROFILE: ""
      STATUS_S3_PREFIX: ${{ vars.STATUS_S3_PREFIX || 's3://bennollweather/climate_imagery/status' }}
      PRODUCT_ID: weather-forecast
      PRODUCT_SCHEDULE: "02:41, 10:41, 14:41, and 22:41 UTC"
      PRODUCT_OUTPUTS_JSON: '["s3://bennollweather/rain","s3://bennollweather/temperature-maximum","s3://bennollweather/temperature-minimum"]'
      MPLCONFIGDIR: /tmp/matplotlib
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
      SCHEDULED_EVENT: ${{ inputs.scheduled }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/maps.txt
      - name: Install map libraries
        run: pip install -r requirements/maps.txt

      - name: Record start
        run: |
          echo "RUN_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          echo "RUN_STARTED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Process
        id: process
        run: bash weather/bin/run_weather_forecast.sh

      - name: Configure temporary AWS credentials
        if: ${{ inputs.upload_to_s3 }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: weather-forecast-${{ github.run_id }}
      - name: Upload pages
        id: upload
        if: ${{ steps.process.outcome == 'success' && (inputs.upload_to_s3) }}
        run: |
          if [[ -z "${AWS_PROFILE:-}" ]]; then unset AWS_PROFILE; fi
          aws s3 cp "$WORK_ROOT/rain.html" s3://bennollweather/rain \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --only-show-errors
          aws s3 cp "$WORK_ROOT/temperature-maximum.html" s3://bennollweather/temperature-maximum \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --only-show-errors
          aws s3 cp "$WORK_ROOT/temperature-minimum.html" s3://bennollweather/temperature-minimum \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --only-show-errors
      - name: Publish heartbeat
        if: ${{ always() && (inputs.upload_to_s3) }}
        run: |
          if [[ -z "${AWS_PROFILE:-}" ]]; then unset AWS_PROFILE; fi
          if [[ "${{ steps.process.outcome }}" == "success" && "${{ steps.upload.outcome }}" == "success" ]]; then
            bash .github/scripts/report_status.sh success "Workflow completed and production uploads succeeded."
          else
            bash .github/scripts/report_status.sh failure "Processing or production upload failed."
          fi
      - name: Delete downloads
        if: always()
        run: bash .github/scripts/cleanup.sh
      - name: Fail the job when processing failed
        if: steps.process.outcome == 'failure'
        run: exit 1
