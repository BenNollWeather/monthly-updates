name: Snow page
on:
  schedule:
    # Same hours as the rain and temperature job. 10:41 is also after the
    # NOAA season-to-date file, which is usually posted around 08:20 UTC.
    - cron: "41 2,10,14,22 * * *"
  workflow_dispatch:
    inputs:
      upload_to_s3:
        description: "Upload the page and the basemap"
        required: false
        default: true
        type: boolean
concurrency:
  group: monthly-snow-anomaly
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WORK_ROOT: /tmp/monthly-updates/snow-anomaly
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_PROFILE: ""
      STATUS_S3_PREFIX: ${{ vars.STATUS_S3_PREFIX || 's3://bennollweather/climate_imagery/status' }}
      PRODUCT_ID: snow-anomaly
      PRODUCT_SCHEDULE: "02:41, 10:41, 14:41, and 22:41 UTC"
      PRODUCT_OUTPUTS_JSON: '["s3://bennollweather/snow-anomaly","s3://bennollweather/snow-forecast","s3://bennollweather/snow","s3://bennollweather/climate_imagery/snow_basemap.js","s3://bennollweather/climate_imagery/snow_terrain.jpg","s3://bennollweather/climate_imagery/snow_counties.png"]'
      MPLCONFIGDIR: /tmp/matplotlib
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/maps.txt
      - name: Install map libraries
        run: pip install -r requirements/maps.txt

      - name: Record start
        run: |
          echo "RUN_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          echo "RUN_STARTED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Process
        id: process
        run: bash snowfall/bin/run_snow_anomaly.sh

      - name: Configure temporary AWS credentials
        if: ${{ github.event_name == 'schedule' || inputs.upload_to_s3 }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: snow-anomaly-${{ github.run_id }}
      - name: Upload page
        id: upload
        if: ${{ steps.process.outcome == 'success' && (github.event_name == 'schedule' || inputs.upload_to_s3) }}
        run: |
          if [[ -z "${AWS_PROFILE:-}" ]]; then unset AWS_PROFILE; fi
          aws s3 cp "$WORK_ROOT/index.html" s3://bennollweather/snow-anomaly \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --only-show-errors
          aws s3 cp "$WORK_ROOT/forecast.html" s3://bennollweather/snow-forecast \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --only-show-errors
          aws s3 cp "$WORK_ROOT/index.html" s3://bennollweather/snow \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --only-show-errors
          aws s3 cp lib/snow_basemap.js s3://bennollweather/climate_imagery/snow_basemap.js \
            --content-type "application/javascript; charset=utf-8" \
            --cache-control "public, max-age=86400" \
            --only-show-errors
          aws s3 cp lib/snow_terrain.jpg s3://bennollweather/climate_imagery/snow_terrain.jpg \
            --content-type "image/jpeg" \
            --cache-control "public, max-age=86400" \
            --only-show-errors
          aws s3 cp lib/snow_counties.png s3://bennollweather/climate_imagery/snow_counties.png \
            --content-type "image/png" \
            --cache-control "public, max-age=86400" \
            --only-show-errors
      - name: Publish heartbeat
        if: ${{ always() && (github.event_name == 'schedule' || inputs.upload_to_s3) }}
        run: |
          if [[ -z "${AWS_PROFILE:-}" ]]; then unset AWS_PROFILE; fi
          if [[ "${{ steps.process.outcome }}" == "success" && "${{ steps.upload.outcome }}" == "success" ]]; then
            bash .github/scripts/report_status.sh success "Workflow completed and production uploads succeeded."
          else
            bash .github/scripts/report_status.sh failure "Processing or production upload failed."
          fi
      - name: Delete downloads and imagery
        if: always()
        run: bash .github/scripts/cleanup.sh
      - name: Fail the job when processing failed
        if: steps.process.outcome == 'failure'
        run: exit 1
