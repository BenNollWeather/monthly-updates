name: Oceans
on:
  schedule:
    # 20:41 UTC is after the Coral Reef Watch afternoon update in both
    # Eastern standard time and Eastern daylight time.
    - cron: "41 20 * * *"
  workflow_dispatch:
    inputs:
      upload_to_s3:
        description: "Upload the page and the maps"
        required: false
        default: true
        type: boolean
concurrency:
  group: monthly-oceans
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WORK_ROOT: /tmp/monthly-updates/oceans
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_PROFILE: ""
      STATUS_S3_PREFIX: ${{ vars.STATUS_S3_PREFIX || 's3://bennollweather/climate_imagery/status' }}
      PRODUCT_ID: oceans
      PRODUCT_SCHEDULE: "20:41 UTC"
      PRODUCT_OUTPUTS_JSON: '["s3://bennollweather/climate/oceans","s3://bennollweather/climate/oceans/anomaly.png","s3://bennollweather/climate/oceans/sst.png","s3://bennollweather/climate/oceans/heatwaves.png","s3://bennollweather/climate/oceans/anomaly-4k.png","s3://bennollweather/climate/oceans/sst-4k.png","s3://bennollweather/climate/oceans/heatwaves-4k.png"]'
      MPLCONFIGDIR: /tmp/matplotlib
      MPLBACKEND: Agg
      CARTOPY_DATA_DIR: /tmp/cartopy
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/maps.txt
      - name: Install map libraries
        run: pip install -r requirements/maps.txt

      - name: Record start
        run: |
          echo "RUN_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          echo "RUN_STARTED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Process
        id: process
        run: bash oceans/bin/run_oceans.sh

      - name: Configure temporary AWS credentials
        if: ${{ github.event_name == 'schedule' || inputs.upload_to_s3 }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: oceans-${{ github.run_id }}
      - name: Upload page
        id: upload
        if: ${{ steps.process.outcome == 'success' && (github.event_name == 'schedule' || inputs.upload_to_s3) }}
        run: |
          if [[ -z "${AWS_PROFILE:-}" ]]; then unset AWS_PROFILE; fi
          aws s3 cp "$WORK_ROOT/index.html" s3://bennollweather/climate/oceans \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --only-show-errors
          for name in anomaly sst heatwaves; do
            aws s3 cp "$WORK_ROOT/${name}.png" "s3://bennollweather/climate/oceans/${name}.png" \
              --content-type "image/png" \
              --cache-control "public, max-age=86400" \
              --only-show-errors
            aws s3 cp "$WORK_ROOT/${name}-4k.png" "s3://bennollweather/climate/oceans/${name}-4k.png" \
              --content-type "image/png" \
              --cache-control "public, max-age=86400" \
              --only-show-errors
          done
      - name: Publish heartbeat
        if: ${{ always() && (github.event_name == 'schedule' || inputs.upload_to_s3) }}
        run: |
          if [[ -z "${AWS_PROFILE:-}" ]]; then unset AWS_PROFILE; fi
          if [[ "${{ steps.process.outcome }}" == "success" && "${{ steps.upload.outcome }}" == "success" ]]; then
            bash .github/scripts/report_status.sh success "Workflow completed and production uploads succeeded."
          else
            bash .github/scripts/report_status.sh failure "Processing or production upload failed."
          fi
      - name: Delete downloads and imagery
        if: always()
        run: bash .github/scripts/cleanup.sh
      - name: Fail the job when processing failed
        if: steps.process.outcome == 'failure'
        run: exit 1
