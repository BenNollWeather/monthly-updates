name: Monthly C3S seasonal
on:
  workflow_dispatch:
    inputs:
      upload_to_s3:
        description: "Upload imagery and publish the heartbeat"
        required: false
        default: true
        type: boolean
      scheduled:
        description: "Count this run as the monthly scheduled event"
        required: false
        default: false
        type: boolean
concurrency:
  group: monthly-c3s
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      WORK_ROOT: /tmp/monthly-updates/c3s
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_PROFILE: ""
      STATUS_S3_PREFIX: ${{ vars.STATUS_S3_PREFIX || 's3://bennollweather/climate_imagery/status' }}
      PRODUCT_ID: c3s
      PRODUCT_SCHEDULE: "12:47 UTC on the 10th"
      PRODUCT_OUTPUTS_JSON: '["s3://bennollweather/copernicus_imagery/monitor/c3s_precip_usa_season1.png","s3://bennollweather/copernicus_imagery/monitor/c3s_precip_atlantic_season1.png","s3://bennollweather/copernicus_imagery/monitor/c3s_precip_globe_season1.png"]'
      MPLCONFIGDIR: /tmp/matplotlib
      CARTOPY_DATA_DIR: /tmp/cartopy
      PYTHONUNBUFFERED: "1"
      SKIP_UPLOAD: "1"
      USE_SYSTEM_PYTHON: "1"
      KEEP_WORK: "1"
      SCHEDULED_EVENT: ${{ inputs.scheduled }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: operational_bundle/config/environment.yml
          activate-environment: operational-monthly
          auto-activate-base: false
          miniconda-version: latest

      - name: Record start
        run: |
          echo "RUN_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          echo "RUN_STARTED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Configure CDS credentials
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          CDSAPI_URL: ${{ secrets.CDSAPI_URL }}
        run: bash .github/scripts/write_cdsapirc.sh

      - name: Process
        id: process
        run: bash operational_bundle/bin/run_c3s.sh

      - name: Configure temporary AWS credentials
        if: always() && (inputs.upload_to_s3)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: c3s-${{ github.run_id }}
      - name: Upload imagery
        id: upload
        if: steps.process.outcome == 'success' && (inputs.upload_to_s3)
        run: |
          if [[ -z "${AWS_PROFILE:-}" ]]; then unset AWS_PROFILE; fi
          aws s3 sync "$WORK_ROOT/copernicus_imagery" s3://bennollweather/copernicus_imagery/ --exclude ".DS_Store" --only-show-errors
          USE_SYSTEM_PYTHON=1 bash operational_bundle/bin/update_s3_index.sh
      - name: Publish heartbeat
        if: always() && (inputs.upload_to_s3)
        run: |
          if [[ "${{ steps.process.outcome }}" == "success" && "${{ steps.upload.outcome }}" == "success" ]]; then
            bash .github/scripts/report_status.sh success "Workflow completed and production uploads succeeded."
          else
            bash .github/scripts/report_status.sh failure "Processing or production upload failed."
          fi
      - name: Delete downloads, imagery, and credentials
        if: always()
        run: bash .github/scripts/cleanup.sh
      - name: Fail the job when processing failed
        if: steps.process.outcome == 'failure'
        run: exit 1
