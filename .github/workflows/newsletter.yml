name: Newsletter

on:
  # EventBridge rule monthly-updates-newsletter fires this at 17 minutes
  # past every hour. GitHub's own scheduler was arriving much later.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the private publishers
        uses: actions/checkout@v4
        with:
          repository: BenNollWeather/benweather-publishers
          ssh-key: ${{ secrets.PUBLISHERS_DEPLOY_KEY }}
          persist-credentials: false

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: newsletter-${{ github.run_id }}

      - name: Publish the latest letters
        run: |
          if [[ -z "${AWS_PROFILE:-}" ]]; then unset AWS_PROFILE; fi
          python3 publish_newsletter.py
