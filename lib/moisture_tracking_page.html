  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f5f7;
      --ink: #171717;
      --muted: #5c656e;
      --line: #d9dce1;
      --card: #fff;
      --nav: #fff;
      --nav-line: #c8ccd2;
      --nav-on: #e7eef8;
      --nav-on-line: #8aa8cc;
      --header: rgba(255,255,255,.96);
      --header-line: #d9dce1;
      --link: #1256a0;
      --shadow: rgba(0,0,0,.12);
      --tag: #5d626a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Libre Franklin", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); font-size: 16px; line-height: 1.45; }
    header { position: sticky; top: 0; z-index: 5; padding: 18px 24px 14px; background: var(--header); border-bottom: 1px solid var(--header-line); backdrop-filter: blur(8px); }
    .brand { display: flex; align-items: center; gap: 20px; }
    .brand-copy { min-width: 0; }
    .brand-copy h1 { margin: 0 0 5px; font-size: 27px; font-weight: 700; letter-spacing: 0; line-height: 1.2; }
    .brand-copy p { margin: 0; color: var(--tag); font-size: 16px; line-height: 1.3; }
    .brand-mark { flex: none; color: inherit; text-decoration: none; }
    .brand-mark img { display: block; height: 56px; width: auto; }
    nav { margin-top: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    nav a, nav summary { color: inherit; text-decoration: none; border: 1px solid var(--nav-line); border-radius: 999px; padding: 7px 11px; background: var(--nav); font: inherit; cursor: pointer; }
    nav > a, nav > .menu > summary { display: inline-block; }
    nav summary { list-style: none; }
    nav summary::-webkit-details-marker { display: none; }
    nav summary::after { content: ""; display: inline-block; margin-left: 7px; border-width: 4px 4px 0; border-style: solid; border-color: currentColor transparent transparent; vertical-align: 2px; }
    nav a:hover, nav summary:hover, nav summary:focus-visible { text-decoration: underline; }
    nav a[aria-current="page"], nav .menu:has(a[aria-current="page"]) > summary { background: var(--nav-on); border-color: var(--nav-on-line); font-weight: 700; }
    nav .menu { position: relative; }
    nav > details.menu:last-of-type > .panel { left: auto; right: 0; }
    nav .panel { position: absolute; z-index: 30; top: calc(100% + 6px); left: 0; display: grid; gap: 6px; min-width: 190px; padding: 8px; border: 1px solid var(--header-line); border-radius: 12px; background: var(--nav); box-shadow: 0 8px 24px var(--shadow); }
    nav .panel a, nav .panel summary { display: block; text-align: left; }
    nav .menu .menu .panel { position: static; min-width: 0; margin-top: 6px; padding: 0 0 0 8px; border: 0; border-radius: 0; background: transparent; box-shadow: none; }
    main { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 8px 0 40px; }
    .dek { margin: 0; color: var(--muted); font-size: 24px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
    .chart { background: var(--card); border-radius: 16px; padding: 18px 20px 16px; margin: 0 0 16px; }
    .chart-head { display: flex; align-items: flex-start; gap: 12px 16px; max-width: 100%; margin-bottom: 8px; }
    .chart-head > :first-child { min-width: 0; flex: 1 1 auto; }
    .chart-head h3 { margin: 0; font-size: clamp(32px, 4.4vw, 48px); font-weight: 700; letter-spacing: -0.035em; line-height: 1.05; }
    .chart-head h3.plot-title { font-size: clamp(26px, 3.8vw, 38px); letter-spacing: -0.03em; line-height: 1.15; }
    .chart-head .dek { margin-top: 6px; }
    canvas.plot { width: 100%; display: block; }
    #map-canvas { height: 520px; }
    #month-canvas { height: 380px; }
    #year-canvas { height: 420px; }
    #stripe-canvas { height: 220px; }
    .chart-actions { display: flex; flex: 0 0 auto; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 8px; margin-left: auto; max-width: 100%; }
    .save-card { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 18px; font-weight: 700; border-radius: 999px; padding: 12px 18px; cursor: pointer; }
    .save-card:hover, .save-card:focus-visible { border-color: var(--ink); }
    .save-card:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
    .notes { margin: 22px 0 8px; max-width: 820px; color: var(--muted); font-size: 20px; }
    .notes p { margin: 0; }
    .site-foot { display: flex; justify-content: flex-end; align-items: center; gap: 12px; margin: 0; padding: 8px 24px 32px; line-height: 0; }
    .site-foot a { color: #8b919a; text-decoration: none; }
    .site-foot a:hover, .site-foot a:focus-visible { color: var(--link); }
    .site-foot svg { display: block; width: 18px; height: 18px; }
    @media (max-width: 720px) {
      .save-card { font-size: 16px; padding: 8px 12px; }
    }
    @media (max-width: 650px) {
      .brand { gap: 12px; }
      .brand-copy h1 { font-size: 22px; }
      .brand-mark img { height: 44px; }
      nav { position: relative; align-items: flex-start; }
      nav > details.menu { position: static; }
      nav > details.menu > .panel,
      nav > details.menu:last-of-type > .panel {
        left: 0;
        right: 0;
        min-width: 0;
        max-height: calc(100vh - 140px);
        overflow: auto;
      }
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111317;
        --ink: #f3f4f6;
        --muted: #aeb4bd;
        --tag: #aeb4bd;

        --header: rgba(20,22,26,.96);
        --header-line: #333842;
        --link: #7db7ff;
        --shadow: rgba(0,0,0,.45);
      }
    }
  </style>

  <script>
  const DATA = __DATA__;
  const MONTHS = ["Jan.", "Feb.", "March", "April", "May", "June", "July", "Aug.", "Sept.", "Oct.", "Nov.", "Dec."];
  const FILES = {
    map: "moisture-tracking-map.png",
    month: "moisture-tracking-month.png",
    year: "moisture-tracking-year.png",
    stripes: "moisture-tracking-stripes.png"
  };
  const BROWN = [122, 78, 36];
  const BROWN_DEEP = [74, 42, 14];
  const BROWN_CAP = [36, 16, 6];
  const BLUE = [47, 104, 168];
  const BLUE_DEEP = [16, 52, 112];
  const BLUE_CAP = [5, 20, 58];
  const STRIPE_STOPS = [[0, [58, 38, 14]], [0.18, [108, 80, 36]], [0.38, [164, 142, 102]], [0.52, [232, 226, 214]], [0.68, [148, 178, 204]], [0.84, [62, 110, 164]], [1, [12, 40, 92]]];
  let GRID = null;
  let fieldCache = null;
  let fieldKey = "";

  function isDark() {
    return matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function palette() {
    const style = getComputedStyle(document.documentElement);
    const pick = (name, fallback) => style.getPropertyValue(name).trim() || fallback;
    return {
      bg: pick("--bg", "#f4f5f7"),
      ink: pick("--ink", "#171717"),
      muted: pick("--muted", "#5c656e"),
      card: pick("--card", "#ffffff"),
      line: pick("--line", "#d9dce1")
    };
  }
  function parseCss(color) {
    const value = (color || "").trim();
    if (value.startsWith("#")) {
      let hex = value.slice(1);
      if (hex.length === 3) hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
      return [parseInt(hex.slice(0, 2), 16), parseInt(hex.slice(2, 4), 16), parseInt(hex.slice(4, 6), 16)];
    }
    const parts = value.match(/[\d.]+/g);
    if (!parts) return [255, 255, 255];
    return [Number(parts[0]), Number(parts[1]), Number(parts[2])];
  }
  function mix(a, b, t) {
    return a.map((v, i) => Math.round(v + (b[i] - v) * t));
  }
  function css(rgb) {
    return "rgb(" + rgb[0] + ", " + rgb[1] + ", " + rgb[2] + ")";
  }
  function inches(value) {
    return (Math.round(value * 100) / 100).toFixed(2) + " in.";
  }
  function finite(values) {
    return values.filter((value) => value != null && isFinite(value));
  }
  function quantile(values, p) {
    const sorted = finite(values).sort((a, b) => a - b);
    if (!sorted.length) return null;
    const k = (sorted.length - 1) * p;
    const i = Math.floor(k);
    const f = k - i;
    return sorted[i] * (1 - f) + sorted[Math.min(sorted.length - 1, i + 1)] * f;
  }
  function stripeColor(t) {
    const u = Math.max(0, Math.min(1, t));
    for (let i = 1; i < STRIPE_STOPS.length; i++) {
      if (u <= STRIPE_STOPS[i][0]) {
        const span = STRIPE_STOPS[i][0] - STRIPE_STOPS[i - 1][0];
        const f = span ? (u - STRIPE_STOPS[i - 1][0]) / span : 0;
        return mix(STRIPE_STOPS[i - 1][1], STRIPE_STOPS[i][1], f);
      }
    }
    return STRIPE_STOPS[STRIPE_STOPS.length - 1][1];
  }
  const SCALE_LO = 70;
  const SCALE_HI = 130;
  const SCALE_STEP = 5;
  function fieldColor(pct, paper) {
    const quiet = 3;
    const span = (SCALE_HI - 100) - quiet;
    const bin = Math.round(pct / SCALE_STEP) * SCALE_STEP;
    if (bin < SCALE_LO) return BROWN_CAP;
    if (bin > SCALE_HI) return BLUE_CAP;
    let t;
    if (bin >= 100) t = Math.max(0, bin - 100 - quiet) / span;
    else t = -Math.max(0, 100 - quiet - bin) / span;
    t = Math.max(-1, Math.min(1, t));
    if (t >= 0) {
      if (t < 0.62) return mix(paper, BLUE, t / 0.62);
      return mix(BLUE, BLUE_DEEP, (t - 0.62) / 0.38);
    }
    const u = -t;
    if (u < 0.62) return mix(paper, BROWN, u / 0.62);
    return mix(BROWN, BROWN_DEEP, (u - 0.62) / 0.38);
  }
  function font(weight, size) {
    return weight + " " + size + 'px "Libre Franklin", sans-serif';
  }
  function px(width, base) {
    return Math.max(14, Math.round(base * Math.min(1.28, Math.max(1, width / 900))));
  }
  function logoImage() {
    const image = document.getElementById(isDark() ? "logo-dark" : "logo-light");
    return image && image.complete && image.naturalWidth ? image : null;
  }
  function drawWordmark(ctx, right, bottom, ink, size) {
    ctx.save();
    ctx.fillStyle = ink;
    ctx.font = font(700, size || 28);
    ctx.textAlign = "right";
    ctx.textBaseline = "bottom";
    ctx.fillText("BNW", right, bottom);
    ctx.restore();
  }
  function drawLogo(ctx, right, bottom, colors, height) {
    const logoH = 84;
    const markH = height || logoH;
    const image = logoImage();
    if (!image) {
      drawWordmark(ctx, right, bottom, colors.ink, height ? 18 : 28);
      return height ? 56 : 96;
    }
    const logoW = markH * (image.naturalWidth / image.naturalHeight);
    ctx.globalAlpha = height ? 0.72 : 1;
    ctx.drawImage(image, right - logoW, bottom - markH, logoW, markH);
    ctx.globalAlpha = 1;
    return logoW;
  }
  function fitSize(ctx, text, maxWidth, start, minSize, weight) {
    let size = start;
    ctx.font = font(weight, size);
    while (size > minSize && ctx.measureText(text).width > maxWidth) {
      size -= 2;
      ctx.font = font(weight, size);
    }
    return size;
  }
  function halo(ctx, text, x, y, fill, paper) {
    ctx.lineWidth = 5;
    ctx.strokeStyle = paper;
    ctx.lineJoin = "round";
    ctx.miterLimit = 2;
    ctx.strokeText(text, x, y);
    ctx.fillStyle = fill;
    ctx.fillText(text, x, y);
  }
  function spread(items, gap, minY, maxY) {
    const rows = items.map((item) => ({
      y: item.y,
      text: item.text,
      lines: item.lines || (item.text ? [item.text] : []),
      color: item.color,
      weight: item.weight,
      span: item.span || gap,
    }));
    rows.sort((a, b) => a.y - b.y);
    for (let i = 1; i < rows.length; i++) {
      const need = rows[i - 1].span === gap && rows[i].span === gap
        ? gap
        : (rows[i - 1].span + rows[i].span) / 2 + 4;
      if (rows[i].y < rows[i - 1].y + need) rows[i].y = rows[i - 1].y + need;
    }
    if (rows.length && rows[rows.length - 1].y > maxY) {
      const shift = rows[rows.length - 1].y - maxY;
      rows.forEach((row) => { row.y -= shift; });
    }
    if (rows.length && rows[0].y < minY) {
      const shift = minY - rows[0].y;
      rows.forEach((row) => { row.y += shift; });
    }
    return rows;
  }
  function gridBytes() {
    if (GRID) return GRID;
    const raw = atob(DATA.map.grid);
    GRID = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) GRID[i] = raw.charCodeAt(i) & 255;
    return GRID;
  }
  function fieldImage(paper) {
    if (fieldCache && fieldKey === paper) return fieldCache;
    const map = DATA.map;
    const canvas = document.createElement("canvas");
    canvas.width = map.nlon;
    canvas.height = map.nlat;
    const ctx = canvas.getContext("2d", { alpha: false });
    const image = ctx.createImageData(map.nlon, map.nlat);
    const bytes = gridBytes();
    const paperRgb = parseCss(paper);
    const dest = image.data;
    for (let i = 0; i < bytes.length; i++) {
      const rgb = bytes[i] === 255 ? paperRgb : fieldColor(bytes[i], paperRgb);
      const p = i * 4;
      dest[p] = rgb[0];
      dest[p + 1] = rgb[1];
      dest[p + 2] = rgb[2];
      dest[p + 3] = 255;
    }
    ctx.putImageData(image, 0, 0);
    fieldCache = canvas;
    fieldKey = paper;
    return canvas;
  }
  function traceLayer(ctx, x, y, w, h, lines) {
    if (!lines || !lines.length) return;
    ctx.beginPath();
    lines.forEach((seg) => {
      let open = false;
      let prev = null;
      for (let i = 0; i < seg.length; i++) {
        if (seg[i][1] < -89) {
          open = false;
          prev = null;
          continue;
        }
        const px = x + (seg[i][0] / 360) * w;
        const py = y + ((90 - seg[i][1]) / 180) * h;
        const jump = prev && (Math.abs(px - prev[0]) > w * 0.18 || Math.abs(py - prev[1]) > h * 0.12);
        if (!open || jump) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
        open = true;
        prev = [px, py];
      }
    });
    ctx.stroke();
  }
  function traceCoasts(ctx, x, y, w, h) {
    const coastWidth = ctx.lineWidth || 0.7;
    ctx.lineWidth = coastWidth;
    ctx.globalAlpha = 0.92;
    traceLayer(ctx, x, y, w, h, typeof COASTS === "undefined" ? [] : COASTS);
    ctx.lineWidth = coastWidth * 0.8;
    ctx.globalAlpha = 0.7;
    traceLayer(ctx, x, y, w, h, typeof COUNTRIES === "undefined" ? [] : COUNTRIES);
    ctx.lineWidth = coastWidth * 0.55;
    ctx.globalAlpha = 0.42;
    traceLayer(ctx, x, y, w, h, typeof STATES === "undefined" ? [] : STATES);
    ctx.lineWidth = coastWidth;
    ctx.globalAlpha = 0.92;
    traceLayer(ctx, x, y, w, h, typeof LAKES === "undefined" ? [] : LAKES);
  }
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function drawScale(ctx, x, y, width, colors) {
    const barH = 14;
    const capW = Math.round(barH * 1.05);
    const paper = parseCss(colors.card);
    const bins = [];
    for (let pct = SCALE_LO; pct <= SCALE_HI; pct += SCALE_STEP) bins.push(pct);
    const barX = x + capW;
    const barRight = x + width - capW;
    const barW = Math.max(bins.length, barRight - barX);
    const segW = barW / bins.length;
    const midY = y + barH / 2;
    ctx.beginPath();
    ctx.moveTo(x, midY);
    ctx.lineTo(barX, y);
    ctx.lineTo(barX, y + barH);
    ctx.closePath();
    ctx.fillStyle = css(BROWN_CAP);
    ctx.fill();
    bins.forEach((pct, i) => {
      const left = barX + i * segW;
      const seg = i === bins.length - 1 ? barRight - left : segW + 0.4;
      ctx.fillStyle = css(fieldColor(pct, paper));
      ctx.fillRect(left, y, seg, barH);
    });
    ctx.beginPath();
    ctx.moveTo(x + width, midY);
    ctx.lineTo(barRight, y);
    ctx.lineTo(barRight, y + barH);
    ctx.closePath();
    ctx.fillStyle = css(BLUE_CAP);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x, midY);
    ctx.lineTo(barX, y);
    ctx.lineTo(barRight, y);
    ctx.lineTo(x + width, midY);
    ctx.lineTo(barRight, y + barH);
    ctx.lineTo(barX, y + barH);
    ctx.closePath();
    ctx.strokeStyle = colors.line;
    ctx.lineWidth = 1;
    ctx.stroke();
    const tens = bins.filter((pct) => pct % 10 === 0);
    const anchors = [SCALE_LO, 100, SCALE_HI];
    const gapOf = (choice) => {
      let minGap = Infinity;
      for (let i = 1; i < choice.length; i++) {
        minGap = Math.min(minGap, (bins.indexOf(choice[i]) - bins.indexOf(choice[i - 1])) * segW);
      }
      return minGap;
    };
    const wide = (trySize) => {
      ctx.font = font(700, trySize);
      return Math.max(ctx.measureText("100").width, ctx.measureText("70%").width);
    };
    let shown = anchors;
    let size = 14;
    const choices = [bins, tens, anchors];
    for (let n = 0; n < choices.length; n++) {
      let trySize = px(width, 17);
      while (trySize > 14 && wide(trySize) + 8 > gapOf(choices[n])) trySize -= 1;
      if (wide(trySize) + 8 <= gapOf(choices[n])) {
        shown = choices[n];
        size = trySize;
        break;

  function downloadText(name, text) {
    const blob = new Blob([text], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = name;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }
  function monthCsv() {
    const rows = [["year", "month", "precipitable_water_inches"]];
    DATA.inches.forEach((value, index) => {
      rows.push([String(DATA.start + index), DATA.month, csvNumber(value)]);
    });
    downloadText("moisture-tracking-month.csv", rows.map((row) => row.join(",")).join("\n") + "\n");
  }
  function yearCsv() {
    const rows = [["year", "month", "precipitable_water_inches"]];
    (DATA.history || []).forEach((item) => {
      rows.push([String(item[0]), CSV_MONTHS[item[1] - 1] || "", csvNumber(item[2])]);
    });
    downloadText("moisture-tracking-year.csv", rows.map((row) => row.join(",")).join("\n") + "\n");
  }
  document.body.addEventListener("click", (event) => {
    const csv = event.target.closest("[data-csv]");
    if (csv) {
      if (csv.dataset.csv === "month") monthCsv();
      else if (csv.dataset.csv === "year") yearCsv();
      return;
    }
    const button = event.target.closest("[data-card]");
    if (!button) return;
    saveCard(button.dataset.card);
  });
  let frame = 0;
  function schedule() {
    cancelAnimationFrame(frame);
    frame = requestAnimationFrame(drawAll);
  }
  drawCharts();
  document.addEventListener("DOMContentLoaded", drawAll);
  window.addEventListener("load", drawAll);
  document.fonts.ready.then(drawAll);
  if (window.ResizeObserver) new ResizeObserver(schedule).observe(document.querySelector("main"));
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
    fieldCache = null;
    schedule();
  });
  </script>
  <script defer>
  drawAll();
  </script>
</body>
</html>
