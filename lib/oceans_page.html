<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/latest_posts/brand/favicon-bnw-black.png" type="image/png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="/latest_posts/brand/favicon-bnw-offwhite.png" type="image/png" media="(prefers-color-scheme: dark)">
  <title>__TITLE__</title>
  __SEO__
  __PRELOAD__
  <link rel="stylesheet" href="https://fonts.bunny.net/css?family=libre-franklin:400,600,700">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f5f7;
      --ink: #171717;
      --muted: #5c656e;
      --line: #d9dce1;
      --card: #fff;
      --nav: #fff;
      --nav-line: #c8ccd2;
      --nav-on: #e7eef8;
      --nav-on-line: #8aa8cc;
      --header: rgba(255,255,255,.96);
      --header-line: #d9dce1;
      --link: #1256a0;
      --shadow: rgba(0,0,0,.12);
      --tag: #5d626a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Libre Franklin", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); font-size: 16px; line-height: 1.45; }
    header { position: sticky; top: 0; z-index: 5; padding: 18px 24px 14px; background: var(--header); border-bottom: 1px solid var(--header-line); backdrop-filter: blur(8px); }
    .brand { display: flex; align-items: center; gap: 20px; }
    .brand-copy { min-width: 0; }
    .brand-copy h1 { margin: 0 0 5px; font-size: 27px; font-weight: 700; letter-spacing: 0; line-height: 1.2; }
    .brand-copy p { margin: 0; color: var(--tag); font-size: 16px; line-height: 1.3; }
    .brand-mark { flex: none; color: inherit; text-decoration: none; }
    .brand-mark img { display: block; height: 56px; width: auto; }
    nav { margin-top: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    nav a, nav summary { color: inherit; text-decoration: none; border: 1px solid var(--nav-line); border-radius: 999px; padding: 7px 11px; background: var(--nav); font: inherit; cursor: pointer; }
    nav > a, nav > .menu > summary { display: inline-block; }
    nav summary { list-style: none; }
    nav summary::-webkit-details-marker { display: none; }
    nav summary::after { content: ""; display: inline-block; margin-left: 7px; border-width: 4px 4px 0; border-style: solid; border-color: currentColor transparent transparent; vertical-align: 2px; }
    nav a:hover, nav summary:hover, nav summary:focus-visible { text-decoration: underline; }
    nav a[aria-current="page"], nav .menu:has(a[aria-current="page"]) > summary { background: var(--nav-on); border-color: var(--nav-on-line); font-weight: 700; }
    nav .menu { position: relative; }
    nav > details.menu:last-of-type > .panel { left: auto; right: 0; }
    nav .panel { position: absolute; z-index: 30; top: calc(100% + 6px); left: 0; display: grid; gap: 6px; min-width: 190px; padding: 8px; border: 1px solid var(--header-line); border-radius: 12px; background: var(--nav); box-shadow: 0 8px 24px var(--shadow); }
    nav .panel a, nav .panel summary { display: block; text-align: left; }
    nav .menu .menu .panel { position: static; min-width: 0; margin-top: 6px; padding: 0 0 0 8px; border: 0; border-radius: 0; background: transparent; box-shadow: none; }
    main { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 8px 0 28px; }
    .dek { margin: 16px 0 0; color: var(--muted); font-size: 24px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
    .model-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 0; }
    .model-row button { font: inherit; font-size: 16px; font-weight: 700; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 8px 14px; min-height: 44px; cursor: pointer; }
    .model-row button[aria-selected="true"] { background: var(--nav-on); border-color: var(--nav-on-line); }
    .model-row button:hover, .model-row button:focus-visible { border-color: var(--ink); }
    .model-row button:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
    .map-card { margin-top: 18px; }
    .scale-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; flex-wrap: wrap; overflow: visible; }
    #legend { width: min(560px, 100%); flex: 1 1 280px; min-width: 0; overflow: visible; }
    .scale { width: 100%; margin: 0 0 8px; overflow: visible; }
    .bar-wrap, .scale.mhw { width: min(480px, 100%); overflow: visible; }
    .scale-top { display: flex; justify-content: space-between; gap: 12px; font-size: 22px; font-weight: 700; line-height: 1.1; margin: 0 0 6px; }
    .bar-row { display: flex; align-items: flex-start; gap: 14px; overflow: visible; }
    .meter { display: flex; align-items: flex-start; overflow: visible; }
    .fill-wrap { flex: 1 1 auto; min-width: 0; overflow: visible; }
    .fill { display: block; height: 16px; }
    .cap { flex: none; width: 0; height: 0; }
    .cap-low { border-top: 8px solid transparent; border-bottom: 8px solid transparent; border-right: 11px solid; }
    .cap-high { border-top: 8px solid transparent; border-bottom: 8px solid transparent; border-left: 11px solid; }
    .swatches { display: flex; height: 16px; border-radius: 2px; overflow: hidden; }
    .swatches i { flex: 1 1 0; }
    .ticks { position: relative; height: 26px; margin-top: 4px; overflow: visible; font-size: 18px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
    .ticks span { position: absolute; top: 0; white-space: nowrap; }
    .mhw .ticks { display: flex; position: static; height: auto; min-height: 22px; }
    .mhw .ticks span { position: static; flex: 1 1 0; transform: none; text-align: center; line-height: 1.15; white-space: normal; }
    .mhw .short { display: none; }
    .ice { display: inline-flex; align-items: center; gap: 6px; flex: none; margin-top: calc(22px * 1.1 + 6px); font-size: 16px; font-weight: 700; color: var(--muted); }
    .ice i { width: 16px; height: 16px; border-radius: 2px; background: #d9e2ea; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
    .download { flex: none; margin-bottom: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 18px; font-weight: 700; border-radius: 999px; padding: 12px 18px; min-height: 44px; text-decoration: none; display: inline-flex; align-items: center; }
    .download:hover, .download:focus-visible { border-color: var(--ink); }
    .download:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
    .map-scroll { overflow: visible; }
    #ocean-map { display: block; width: 100%; height: auto; }
    .notes { margin: 18px 0 8px; max-width: 820px; color: var(--muted); font-size: 18px; }
    .notes p { margin: 0; }
    .site-foot { display: flex; justify-content: flex-end; align-items: center; gap: 12px; margin: 0; padding: 8px 24px 32px; line-height: 0; }
    .site-foot a { color: #8b919a; text-decoration: none; }
    .site-foot a:hover, .site-foot a:focus-visible { color: var(--link); }
    .site-foot svg { display: block; width: 18px; height: 18px; }
    @media (max-width: 650px) {
      .brand { gap: 12px; }
      .brand-copy h1 { font-size: 22px; }
      .brand-mark img { height: 44px; }
      nav { position: relative; align-items: flex-start; }
      nav > details.menu { position: static; }
      nav > details.menu > .panel,
      nav > details.menu:last-of-type > .panel {
        left: 0;
        right: 0;
        min-width: 0;
        max-height: calc(100vh - 140px);
        overflow: auto;
      }
      .dek { font-size: 18px; }
      .download { padding: 10px 16px; }
      .scale-top { font-size: 18px; }
      .ticks { font-size: 15px; }
      .ice { margin-top: calc(18px * 1.1 + 6px); }
      .mhw .long { display: none; }
      .mhw .short { display: inline; }
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111317;
        --ink: #f3f4f6;
        --muted: #aeb4bd;
        --tag: #aeb4bd;
        --line: #373c46;
        --card: #1b1e24;
        --nav: #1b1e24;
        --nav-line: #373c46;
        --nav-on: #29394d;
        --nav-on-line: #6086ad;
        --header: rgba(20,22,26,.96);
        --header-line: #333842;
        --link: #7db7ff;
        --shadow: rgba(0,0,0,.45);
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-copy">
        <h1>BenNollWeather</h1>
        <p>Bringing weather and climate data to life</p>
      </div>
      <a class="brand-mark" href="/latest_posts"><picture>
        <source srcset="/latest_posts/brand/bnw-brick-offwhite.png" media="(prefers-color-scheme: dark)">
        <img src="/latest_posts/brand/bnw-brick-black.png" alt="Ben Noll Weather" width="1156" height="508">
      </picture></a>
    </div>
    __NAV__
  </header>
  <main>
    __BUTTONS__
    <p class="dek" id="ocean-dek">__DEK__</p>
    <section class="map-card">
      <div class="scale-row">
        <div id="legend">__LEGEND__</div>
        <a class="download" id="download" href="__DOWNLOAD_HREF__" download="__DOWNLOAD_NAME__">Download</a>
      </div>
      <div class="map-scroll">
        <img id="ocean-map" src="__IMAGE__" alt="__ALT__" width="__WIDTH__" height="__HEIGHT__">
      </div>
    </section>
    <section class="notes">
      <p id="ocean-source">__SOURCE__</p>
    </section>
  </main>
  <footer class="site-foot"><a href="https://www.bennollsays.com/about" aria-label="About" title="About"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11.2v5"/><path d="M12 8h.01" stroke-width="2.5"/></svg></a><a href="mailto:bennollweather@gmail.com" aria-label="Email Ben Noll" title="Email Ben Noll"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 7 9-7"/></svg></a></footer>
  <script>
  const VIEWS = __VIEWS__;
  const row = document.getElementById("view-row");
  const buttons = Array.from(row.querySelectorAll("button"));
  const image = document.getElementById("ocean-map");
  const download = document.getElementById("download");

  function show(id) {
    const view = VIEWS[id];
    if (!view) return;
    image.src = view.src;
    image.alt = view.alt;
    document.getElementById("ocean-dek").textContent = view.dek;
    document.getElementById("ocean-source").textContent = view.source;
    document.getElementById("legend").innerHTML = view.legend;
    download.href = view.card;
    download.download = view.filename;
    buttons.forEach((button) => {
      button.setAttribute("aria-selected", button.dataset.view === id ? "true" : "false");
    });
  }

  buttons.forEach((button) => {
    button.addEventListener("click", () => {
      show(button.dataset.view);
      if (history.replaceState) history.replaceState(null, "", "#" + button.dataset.view);
    });
  });
  row.addEventListener("keydown", (event) => {
    if (event.key !== "ArrowRight" && event.key !== "ArrowLeft") return;
    const index = buttons.findIndex((button) => button.getAttribute("aria-selected") === "true");
    const step = event.key === "ArrowRight" ? 1 : -1;
    const next = buttons[(index + step + buttons.length) % buttons.length];
    next.focus();
    show(next.dataset.view);
    if (history.replaceState) history.replaceState(null, "", "#" + next.dataset.view);
    event.preventDefault();
  });
  Object.keys(VIEWS).forEach((id) => {
    const preload = new Image();
    preload.src = VIEWS[id].src;
  });
  const opening = (location.hash || "").replace("#", "");
  if (VIEWS[opening]) show(opening);
  </script>
</body>
</html>
